[project]
name = "fatigueguard"
version = "0.1.0"
description = "AI-powered operator fatigue detection for heavy machinery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-contrib-python>=4.8.0,<4.13",
    "mediapipe>=0.10.13,<0.11",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "PyQt5>=5.15.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
    "gTTS>=2.3.0",
    "reportlab>=4.0.0",
    "psutil>=5.9.0",
]

[tool.uv]
package = false
